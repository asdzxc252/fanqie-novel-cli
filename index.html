<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小说热销榜</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; font-size: 1.8em; color: #e74c3c; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #888; font-size: 0.85em; margin-bottom: 20px; }
    .platform { margin-bottom: 32px; }
    .platform-title { font-size: 1.1em; font-weight: bold; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid #e74c3c; color: #2c3e50; }
    .platform-title span { font-size: 0.75em; color: #888; font-weight: normal; margin-left: 8px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
    .tab { padding: 8px 20px; border: none; background: #ddd; border-radius: 20px; cursor: pointer; font-size: 0.95em; transition: all 0.2s; }
    .tab.active { background: #e74c3c; color: white; }
    .tab:hover:not(.active) { background: #ccc; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .error { text-align: center; padding: 30px; color: #e74c3c; background: #fff0f0; border-radius: 8px; }
    .book-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .book-card { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.2s; position: relative; }
    .book-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .rank-badge { position: absolute; top: 12px; left: 12px; min-width: 28px; height: 28px; background: #e74c3c; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.85em; }
    .rank-1 { background: #f39c12; }
    .rank-2 { background: #95a5a6; }
    .rank-3 { background: #cd6133; }
    .book-title { font-weight: bold; font-size: 1em; margin-bottom: 6px; color: #2c3e50; padding-left: 36px; }
    .book-meta { font-size: 0.82em; color: #888; margin-bottom: 6px; padding-left: 36px; }
    .category { display: inline-block; background: #fee; color: #e74c3c; padding: 1px 7px; border-radius: 10px; font-size: 0.8em; }
    .book-synopsis { font-size: 0.85em; color: #666; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .source-badge { display: inline-block; background: #2c3e50; color: white; padding: 2px 8px; border-radius: 4px; font-size: 0.75em; margin-right: 6px; }
    footer { text-align: center; padding: 30px; color: #aaa; font-size: 0.8em; }
    .hidden { display: none; }
    @media (max-width: 600px) {
      .book-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍅📚 小说热销榜</h1>
    <p class="subtitle" id="updated">加载中...</p>

    <div class="tabs">
      <button class="tab active" data-source="all">全平台</button>
      <button class="tab" data-source="fanqie">番茄小说</button>
      <button class="tab" data-source="39xs">三九小说</button>
    </div>

    <div id="fanqie-section" class="platform">
      <div class="platform-title">🍅 番茄小说 <span id="fanqie-sub"></span></div>
      <div id="fanqie-loading" class="loading">正在获取番茄小说数据...</div>
      <div id="fanqie-error" class="error hidden"></div>
      <div id="fanqie-books" class="book-list hidden"></div>
    </div>

    <div id="xs39-section" class="platform">
      <div class="platform-title">📖 三九小说 <span></span></div>
      <div id="xs39-loading" class="loading">正在获取三九小说数据...</div>
      <div id="xs39-error" class="error hidden"></div>
      <div id="xs39-books" class="book-list hidden"></div>
    </div>

    <footer>数据来源：番茄小说 · 三九小说 · 由 fanqie-novel-cli 生成</footer>
  </div>

  <script>
    // ─── Fanqie API ───────────────────────────────────────────────────────
    async function fetchFanqie(type) {
      const resp = await fetch('https://fanqienovel.com/api/rank/list?type=' + type, {
        headers: {
          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
          'Referer': 'https://fanqienovel.com/'
        }
      });
      const json = await resp.json();
      return (json.data?.list || []).map(b => ({
        rank: 0, // filled later
        platform: 'fanqie',
        title: b.bookName,
        author: b.author,
        category: b.categoryName || '都市',
        synopsis: b.abstract || '',
      }));
    }

    // ─── 39xs HTML scraping ───────────────────────────────────────────────
    async function fetch39xs() {
      // Use CORS proxy for cross-origin HTML fetch
      const proxy = 'https://api.allorigins.win/raw?url=';
      const url = encodeURIComponent('https://www.39xs.org/');
      const resp = await fetch(proxy + url);
      const html = await resp.text();
      const books = [];

      // Parse hot list items: <li><a href="/book_ID.html">Title</a><span class="y">Author</span></li>
      const hotRe = /<li><a href="\/book_(\d+)\.html">([^<]+)<\/a><span class="y">([^<]+)<\/span><\/li>/g;
      let m;
      while ((m = hotRe.exec(html)) !== null && books.length < 30) {
        books.push({
          rank: 0,
          platform: '39xs',
          title: m[2].trim(),
          author: m[3].trim(),
          category: '热门',
          synopsis: '',
        });
      }
      return books;
    }

    function renderBook(book, index) {
      const rank = index + 1;
      const rankClass = rank <= 3 ? ' rank-' + rank : '';
      return `
        <div class="book-card">
          <div class="rank-badge${rankClass}">${rank}</div>
          <div class="book-title">${escape(book.title)}</div>
          <div class="book-meta">
            <span class="source-badge">${book.platform === 'fanqie' ? '番茄' : '三九'}</span>
            <span class="category">${escape(book.category)}</span>
            &nbsp;作者：${escape(book.author)}
          </div>
          ${book.synopsis ? `<div class="book-synopsis">${escape(book.synopsis)}</div>` : ''}
        </div>`;
    }

    function escape(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    let fanqieBooks = [];
    let xs39Books = [];
    let currentSource = 'all';

    async function loadFanqie() {
      try {
        const [male, female] = await Promise.all([fetchFanqie(1), fetchFanqie(2)]);
        fanqieBooks = [...male.map((b,i)=>({...b,rank:i+1})), ...female.map((b,i)=>({...b,rank:i+1}))];
        document.getElementById('fanqie-loading').classList.add('hidden');
        document.getElementById('fanqie-books').classList.remove('hidden');
        document.getElementById('fanqie-sub').textContent = '男频+'女频 各' + male.length + '本';
        render();
      } catch(e) {
        document.getElementById('fanqie-loading').classList.add('hidden');
        document.getElementById('fanqie-error').classList.remove('hidden');
        document.getElementById('fanqie-error').textContent = '番茄小说加载失败: ' + e.message;
      }
    }

    async function load39xs() {
      try {
        xs39Books = await fetch39xs();
        xs39Books = xs39Books.map((b, i) => ({...b, rank: i+1}));
        document.getElementById('xs39-loading').classList.add('hidden');
        document.getElementById('xs39-books').classList.remove('hidden');
        render();
      } catch(e) {
        document.getElementById('xs39-loading').classList.add('hidden');
        document.getElementById('xs39-error').classList.remove('hidden');
        document.getElementById('xs39-error').textContent = '三九小说加载失败: ' + e.message;
      }
    }

    function render() {
      let all = [];
      if (currentSource === 'all' || currentSource === 'fanqie') {
        all = all.concat(fanqieBooks);
      }
      if (currentSource === 'all' || currentSource === '39xs') {
        all = all.concat(xs39Books);
      }

      const container = document.getElementById('fanqie-books');
      if (currentSource === 'all') {
        document.getElementById('fanqie-books').classList.add('hidden');
        document.getElementById('xs39-books').classList.remove('hidden');
        document.getElementById('xs39-books').innerHTML = all.map((b,i) => renderBook(b, i)).join('');
      } else if (currentSource === 'fanqie') {
        document.getElementById('xs39-books').classList.add('hidden');
        document.getElementById('fanqie-books').classList.remove('hidden');
        document.getElementById('fanqie-books').innerHTML = fanqieBooks.map((b,i) => renderBook(b, i)).join('');
      } else {
        document.getElementById('fanqie-books').classList.add('hidden');
        document.getElementById('xs39-books').classList.remove('hidden');
        document.getElementById('xs39-books').innerHTML = xs39Books.map((b,i) => renderBook(b, i)).join('');
      }
    }

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSource = btn.dataset.source;
        render();
      });
    });

    // Init
    loadFanqie();
    load39xs();
    document.getElementById('updated').textContent = '更新时间: ' + new Date().toLocaleString('zh-CN');
  </script>
</body>
</html>
