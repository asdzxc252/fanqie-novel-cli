<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄小说热销榜</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f5f5f5; color: #333; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    h1 { text-align: center; font-size: 1.8em; color: #e74c3c; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #888; font-size: 0.9em; margin-bottom: 20px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
    .tab { padding: 8px 20px; border: none; background: #ddd; border-radius: 20px; cursor: pointer; font-size: 0.95em; transition: all 0.2s; }
    .tab.active { background: #e74c3c; color: white; }
    .tab:hover:not(.active) { background: #ccc; }
    .loading { text-align: center; padding: 60px; color: #888; }
    .error { text-align: center; padding: 40px; color: #e74c3c; }
    .book-list { display: flex; flex-direction: column; gap: 12px; }
    .book-card { background: white; border-radius: 12px; padding: 16px; display: flex; gap: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.2s; }
    .book-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .rank-badge { min-width: 36px; height: 36px; background: #e74c3c; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1em; flex-shrink: 0; }
    .rank-1 { background: #f39c12; }
    .rank-2 { background: #95a5a6; }
    .rank-3 { background: #cd6133; }
    .book-info { flex: 1; min-width: 0; }
    .book-title { font-weight: bold; font-size: 1.1em; margin-bottom: 4px; color: #2c3e50; }
    .book-meta { font-size: 0.85em; color: #888; margin-bottom: 6px; }
    .book-synopsis { font-size: 0.9em; color: #666; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .category { display: inline-block; background: #fee; color: #e74c3c; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; }
    .hidden { display: none; }
    footer { text-align: center; padding: 30px; color: #aaa; font-size: 0.8em; }
    @media (max-width: 600px) {
      .book-card { flex-direction: column; }
      .rank-badge { width: 32px; height: 32px; font-size: 0.9em; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍅 番茄小说热销榜</h1>
    <p class="subtitle" id="updated">加载中...</p>
    <div class="tabs">
      <button class="tab active" data-type="1">男频热销</button>
      <button class="tab" data-type="2">女频热销</button>
    </div>
    <div id="content">
      <div class="loading">正在获取数据...</div>
    </div>
    <footer>数据来源：番茄小说 · 由 fanqie-novel-cli 生成</footer>
  </div>

  <script>
    const API_BASE = 'https://fanqienovel.com';
    let currentType = 1;
    let cache = {};

    async function fetchRankings(type) {
      if (cache[type]) return cache[type];
      try {
        const resp = await fetch(`${API_BASE}/api/rank/list?type=${type}`, {
          headers: {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
            'Referer': 'https://fanqienovel.com/'
          }
        });
        const json = await resp.json();
        cache[type] = json.data?.list || [];
        return cache[type];
      } catch(e) {
        console.error(e);
        return [];
      }
    }

    function renderBook(book, rank) {
      const rankClass = rank <= 3 ? `rank-${rank}` : '';
      return `
        <div class="book-card">
          <div class="rank-badge ${rankClass}">${rank}</div>
          <div class="book-info">
            <div class="book-title">${escape(book.bookName)}</div>
            <div class="book-meta">
              <span class="category">${escape(book.categoryName || '都市')}</span>
              &nbsp;作者：${escape(book.author)}
            </div>
            <div class="book-synopsis">${escape(book.abstract || '暂无简介')}</div>
          </div>
        </div>
      `;
    }

    function escape(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function load(type) {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">正在获取数据...</div>';
      document.getElementById('updated').textContent = '加载中...';

      const books = await fetchRankings(type);
      if (books.length === 0) {
        content.innerHTML = '<div class="error">数据获取失败，请稍后重试</div>';
        document.getElementById('updated').textContent = '';
        return;
      }

      const now = new Date().toLocaleString('zh-CN');
      document.getElementById('updated').textContent = `更新时间：${now}`;

      content.innerHTML = `<div class="book-list">${books.map((b, i) => renderBook(b, i + 1)).join('')}</div>`;
    }

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentType = parseInt(btn.dataset.type);
        load(currentType);
      });
    });

    load(1);
  </script>
</body>
</html>
